id: dvd-l2-09
database: dvdrental
level: 2
title: "Фільми, дорожчі за середню ціну своєї категорії"
business_question: >
  Які фільми коштують дорожче за середню ставку прокату в межах власної
  категорії?
sql_features: [subquery_correlated, join_inner]
description: >
  Підзапит повторно звертається до category_id зовнішнього рядка для
  кожного фільму — на відміну від dvd-l2-08, тут "середнє" різне для
  кожної категорії, тому підзапит не можна винести окремо один раз.
expected_insight: >
  Оскільки rental_rate у dvdrental набуває лише трьох значень
  (0.99 / 2.99 / 4.99), "вище середнього" на практиці означає рівно
  4.99 — у категорії з більш детальною шкалою цін результат виглядав би
  змістовніше.
sql: |
  SELECT f.title, cat.name AS category_name, f.rental_rate
  FROM film f
  JOIN film_category fc ON fc.film_id = f.film_id
  JOIN category cat ON cat.category_id = fc.category_id
  WHERE f.rental_rate > (
      SELECT AVG(f2.rental_rate)
      FROM film f2
      JOIN film_category fc2 ON fc2.film_id = f2.film_id
      WHERE fc2.category_id = fc.category_id
  )
  ORDER BY f.rental_rate DESC, f.title
  LIMIT 15;
