id: dvd-l3-08
database: dvdrental
level: 3
title: "Накопичувальна частка оренд за фільмом"
business_question: >
  Які фільми орендують найчастіше, і яка накопичувальна кількість оренд
  набирається в міру проходження списку від найпопулярнішого до менш
  популярного?
sql_features: [cte, window_function]
description: >
  CTE рахує кількість оренд на фільм один раз, а SUM(...) OVER
  (ORDER BY ...) без PARTITION BY додає до кожного рядка наростаючий
  підсумок по всьому впорядкованому набору — той самий прийом, що й для
  ABC-аналізу, але тут узятий сам по собі як демонстрація running total.
expected_insight: >
  Оскільки багато фільмів мають однакову кількість оренд (32, 31...),
  накопичувальна сума "перестрибує" однаковими блоками для рядків з
  рівним rental_count — SUM() OVER рахує кумулятив по порядку рядків, а
  не по унікальних значеннях rental_count.
sql: |
  WITH film_rentals AS (
      SELECT f.title, COUNT(*) AS rental_count
      FROM rental r
      JOIN inventory i ON i.inventory_id = r.inventory_id
      JOIN film f ON f.film_id = i.film_id
      GROUP BY f.title
  )
  SELECT
      title,
      rental_count,
      SUM(rental_count) OVER (ORDER BY rental_count DESC) AS cumulative_rentals
  FROM film_rentals
  ORDER BY rental_count DESC
  LIMIT 15;
